<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My FB Command Center</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        h1 { font-size: 18px; margin-bottom: 5px; text-align: center; }
        h2 { font-size: 15px; margin-bottom: 8px; }
        p { font-size: 13px; color: var(--tg-theme-hint-color, #707579); text-align: center; margin-bottom: 12px; }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            box-sizing: border-box;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: inherit;
        }
        textarea { resize: vertical; height: 60px; }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .btn-green {
            background-color: #42b72a;
        }
        .browser-frame {
            width: 100%;
            height: 350px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background: #ffffff;
            margin-top: 10px;
        }
        .output-box {
            background: var(--tg-theme-bg-color, #ffffff);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            white-space: pre-wrap;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎯 FB Command Center</h1>
        <p id="greeting">Your workflow & browsing hub.</p>
    </div>

    <!-- Section 1: Facebook Browser View -->
    <div class="card">
        <h2>🌐 Facebook Browser Viewer</h2>
        <p style="margin-bottom: 8px;">Browse or open mobile Facebook below:</p>
        <button class="btn btn-green" onclick="openFBExternal()">Open Facebook App/Browser</button>
        <iframe src="https://m.facebook.com" class="browser-frame" title="Facebook Browser"></iframe>
    </div>

    <!-- Section 2: Post Planner -->
    <div class="card">
        <h2>📝 Draft Facebook Post</h2>
        <textarea id="postContent" placeholder="Write your post caption here..."></textarea>
        <button class="btn" onclick="savePost()">Save Post Draft</button>
        <div id="savedPostDisplay" class="output-box" style="display:none;"></div>
    </div>

    <!-- Section 3: Make Friends & Networking -->
    <div class="card">
        <h2>🤝 Make Friends & Connect</h2>
        <input type="text" id="friendName" placeholder="Friend's Name">
        <input type="text" id="friendContact" placeholder="Social Handle / Chat Link">
        <button class="btn" onclick="addFriend()">Add to Friends List</button>
        <div id="friendDisplay" class="output-box" style="display:none;"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById("greeting").innerText = `Welcome back, ${user.first_name}!`;
        }

        function openFBExternal() {
            tg.openLink('https://m.facebook.com');
        }

        function savePost() {
            let post = document.getElementById("postContent").value;
            if (post.trim() === "") {
                tg.showAlert("Please write something first!");
                return;
            }
            let display = document.getElementById("savedPostDisplay");
            display.style.display = "block";
            display.innerHTML = "<b>Saved Draft:</b><br>" + post;
            tg.showAlert("Post draft saved!");
        }

        function addFriend() {
            let name = document.getElementById("friendName").value;
            let contact = document.getElementById("friendContact").value;
            if (name.trim() === "") {
                tg.showAlert("Please enter your friend's name!");
                return;
            }
            let display = document.getElementById("friendDisplay");
            display.style.display = "block";
            display.innerHTML += `• <b>${name}</b> (${contact || 'No contact info'})<br>`;
            document.getElementById("friendName").value = "";
            document.getElementById("friendContact").value = "";
            tg.showAlert(`Successfully added ${name} to your friends list!`);
        }
    </script>
</body>
</html>
