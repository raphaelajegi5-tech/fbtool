<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Account Creator Mini App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        h1 { font-size: 18px; margin-bottom: 5px; text-align: center; }
        h2 { font-size: 16px; margin-bottom: 10px; }
        p { font-size: 13px; color: var(--tg-theme-hint-color, #707579); text-align: center; margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            box-sizing: border-box;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .btn-secondary {
            background-color: #42b72a;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📱 FB Account Creator</h1>
        <p id="greeting">Manage your account workflow inside Telegram.</p>
    </div>

    <div class="card">
        <h2>Register New Account</h2>
        <input type="text" id="accName" placeholder="Full Name">
        <input type="text" id="accContact" placeholder="Mobile Number or Email">
        <input type="password" id="accPass" placeholder="New Password">
        <button class="btn" onclick="saveDraft()">Save Details Locally</button>
        <button class="btn btn-secondary" onclick="openFacebookSignup()">Open Official Facebook Signup</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById("greeting").innerText = `Welcome, ${user.first_name}! Set up your account below.`;
        }
        function saveDraft() {
            let name = document.getElementById("accName").value;
            if (name.trim() === "") {
                tg.showAlert("Please fill in your name first!");
                return;
            }
            tg.showAlert(`Details saved for ${name}!`);
        }
        function openFacebookSignup() {
            // Uses Telegram's native link opener which works reliably inside Mini Apps
            tg.openLink('https://m.facebook.com/reg/');
        }
    </script>
</body>
</html>
